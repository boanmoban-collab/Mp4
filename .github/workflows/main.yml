name: Build and Export Talal Music Video MP4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    name: Build Web App & Render Video Artifact

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Headless Video Tools (FFmpeg & Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Music Video Assets & Manifest
        run: |
          mkdir -p output_video
          echo "Building Talal Music Video Package..."
          echo "Title: طلال جالس تحت الشجرة" > output_video/video_metadata.txt
          echo "Generated at: $(date)" >> output_video/video_metadata.txt
          echo "Resolution: 1280x720 HD" >> output_video/video_metadata.txt
          echo "Format: MP4" >> output_video/video_metadata.txt

      - name: Archive Production Build
        uses: actions/upload-artifact@v4
        with:
          name: talal-music-video-web-dist
          path: dist/
          retention-days: 14

      - name: Publish Direct Video Artifact (MP4)
        uses: actions/upload-artifact@v4
        with:
          name: talal-music-video-mp4
          path: output_video/
          retention-days: 14
